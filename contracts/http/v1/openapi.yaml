openapi: 3.1.0
info:
  title: AegisLink HTTP API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:4321
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /readyz:
    get:
      operationId: readiness
      security: []
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account, Human Principal, Personal Agent, and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated account and new server-side session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: []
      responses:
        "204":
          description: Session revoked and cookie cleared
  /api/v1/auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current authenticated User and Personal Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/account/settings:
    get:
      operationId: getAccountSettings
      responses:
        "200":
          description: Account profile and durable interface preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsResponse"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAccountSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountSettingsRequest"
      responses:
        "200":
          description: Updated account profile and interface preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/account/password:
    post:
      operationId: changeAccountPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other sessions revoked
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/bootstrap:
    get:
      operationId: bootstrap
      responses:
        "200":
          description: Authenticated User, Personal Agent, and model metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
  /api/v1/ag-ui:
    post:
      operationId: runAgent
      summary: Run the personal agent over the AG-UI protocol
      description: |
        Accepts an AG-UI RunAgentInput and streams AG-UI events. The threadId
        must identify an existing AegisLink conversation. PostgreSQL history is
        authoritative; earlier client messages are not used as trusted history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgUiRunAgentInput"
      responses:
        "200":
          description: AG-UI Server-Sent Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/agents:
    get:
      operationId: listAgents
      responses:
        "200":
          description: Personal Agents owned by the authenticated Principal
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"
  /api/v1/agents/{agentId}/instructions:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getAgentInstructions
      responses:
        "200":
          description: Owner-only editable instructions for the Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInstructions"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAgentInstructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentInstructionsRequest"
      responses:
        "200":
          description: Agent instructions updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInstructions"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/profile:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getAgentProfile
      responses:
        "200":
          description: Owner view of the Agent's stable identity, effective capabilities, facts, projections, and disclosure policies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAgentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentProfileRequest"
      responses:
        "200":
          description: Agent identity updated and Profile version advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/profile/disclosure-policies:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    patch:
      operationId: updateAgentProfileDisclosurePolicies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDisclosurePoliciesRequest"
      responses:
        "200":
          description: Disclosure policy overrides saved and Profile version advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/impressions:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentImpressions
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, resolved, stale, superseded, dismissed]
      responses:
        "200":
          description: Model-created, private working impressions for the Agent
          content:
            application/json:
              schema:
                type: object
                required: [impressions]
                properties:
                  impressions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Impression"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/impressions/{impressionId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - in: path
        name: impressionId
        required: true
        schema:
          type: string
    patch:
      operationId: updateAgentImpression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateImpressionRequest"
      responses:
        "200":
          description: Impression corrected or its lifecycle changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Impression"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/fact-candidates:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentFactCandidates
      responses:
        "200":
          description: Fact candidates proposed by the model and awaiting owner review
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/FactCandidate"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/fact-candidates/{candidateId}/confirm:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - in: path
        name: candidateId
        required: true
        schema:
          type: string
    post:
      operationId: confirmAgentFactCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmFactCandidateRequest"
      responses:
        "200":
          description: Candidate promoted to a confirmed private Fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/fact-candidates/{candidateId}/reject:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - in: path
        name: candidateId
        required: true
        schema:
          type: string
    post:
      operationId: rejectAgentFactCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectFactCandidateRequest"
      responses:
        "204":
          description: Candidate rejected
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/confirmed-facts/{factId}/revoke:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - in: path
        name: factId
        required: true
        schema:
          type: string
    post:
      operationId: revokeAgentConfirmedFact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "200":
          description: Confirmed Fact revoked and Profile version advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/publication:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getAgentPublication
      responses:
        "200":
          description: Owner-only AgentFacts publication state and preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPublication"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAgentPublication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentPublicationRequest"
      responses:
        "200":
          description: Publication settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPublication"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/publication/verify-hostname:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: verifyAgentPublicationHostname
      responses:
        "200":
          description: DNS TXT hostname verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPublication"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/publication/rotate-key:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: rotateAgentPublicationKey
      responses:
        "200":
          description: Agent signing key rotated and active publication rebuilt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPublication"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/access-tokens:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentAccessTokens
      responses:
        "200":
          description: AgentFacts query tokens without their secret values
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentAccessToken"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgentAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentAccessTokenRequest"
      responses:
        "201":
          description: Token created; secret is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAgentAccessToken"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/access-tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - in: path
        name: tokenId
        required: true
        schema:
          type: string
    delete:
      operationId: revokeAgentAccessToken
      responses:
        "204":
          description: Agent access token revoked
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/agent-card-preview:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getAgentCardPreview
      responses:
        "200":
          description: Owner-only, non-publishable A2A AgentCard draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCardPreview"
        "404":
          $ref: "#/components/responses/Error"
  /.well-known/agentfacts.json:
    get:
      operationId: getPublicAgentFacts
      security: []
      responses:
        "200":
          description: Signed public and indexable AgentFacts document selected by Host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentFactsDocument"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /.well-known/jwks.json:
    get:
      operationId: getAgentFactsJwks
      security: []
      responses:
        "200":
          description: Public signing keys for the Agent selected by Host
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "404":
          $ref: "#/components/responses/Error"
  /.well-known/agentfacts-revocations.json:
    get:
      operationId: getAgentFactsRevocations
      security: []
      responses:
        "200":
          description: Revoked AgentFacts publication and signing-key identifiers
          content:
            application/json:
              schema:
                type: object
                required: [publicationIds, keyIds, updatedAt]
                properties:
                  publicationIds:
                    type: array
                    items:
                      type: string
                  keyIds:
                    type: array
                    items:
                      type: string
                  updatedAt:
                    type: string
                    format: date-time
        "404":
          $ref: "#/components/responses/Error"
  /agentfacts/query:
    post:
      operationId: queryAgentFacts
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentFactsQueryRequest"
      responses:
        "200":
          description: Short-lived signed AgentFacts projection selected by Host and audience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentFactsDocument"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/memories:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentMemories
      responses:
        "200":
          description: Active long-term memories scoped to this Personal Agent
          content:
            application/json:
              schema:
                type: object
                required: [memories]
                properties:
                  memories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Memory"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgentMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoryRequest"
      responses:
        "201":
          description: Agent-scoped memory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/memories/{memoryId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/MemoryId"
    patch:
      operationId: updateAgentMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoryRequest"
      responses:
        "200":
          description: Memory updated or confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: forgetAgentMemory
      responses:
        "204":
          description: Memory forgotten and excluded from future retrieval
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/skills:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentSkills
      responses:
        "200":
          description: Skills installed for this Personal Agent
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: installAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallSkillRequest"
      responses:
        "201":
          description: SKILL.md validated, installed, and bound to this Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/skills/import:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: importAgentSkill
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bundle]
              properties:
                bundle:
                  type: string
                  format: binary
                  description: A SKILL.md file or ZIP bundle containing a root SKILL.md
                version:
                  type: string
                  maxLength: 80
                  description: Optional immutable version label; omitted imports use a bundle-hash-derived local label
      responses:
        "201":
          description: Local Skill file or bundle validated, imported, and bound to this Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/SkillId"
    patch:
      operationId: updateAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Per-Agent Skill enablement updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: uninstallAgentSkill
      responses:
        "204":
          description: Skill unbound from this Agent
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/mcp-servers:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentMcpServers
      responses:
        "200":
          description: MCP Servers configured for this Personal Agent
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/McpServer"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/mcp-servers:
    get:
      operationId: listMcpServers
      responses:
        "200":
          description: MCP Servers installed in the authenticated user's plugin library
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/McpServer"
    post:
      operationId: createMcpServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMcpServerRequest"
      responses:
        "201":
          description: User-owned MCP Server installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServer"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/mcp-servers/{serverId}:
    parameters:
      - $ref: "#/components/parameters/McpServerId"
    patch:
      operationId: updateMcpServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMcpServerRequest"
      responses:
        "200":
          description: User-owned MCP Server metadata updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServer"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMcpServer
      responses:
        "204":
          description: MCP Server, cached tools, and all Agent bindings removed from the user's library
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/mcp-servers/{serverId}/refresh:
    parameters:
      - $ref: "#/components/parameters/McpServerId"
    post:
      operationId: refreshMcpServer
      responses:
        "200":
          description: MCP connection checked and tool catalog refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServer"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/v1/mcp-servers/{serverId}/tools/{toolId}:
    parameters:
      - $ref: "#/components/parameters/McpServerId"
      - name: toolId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateMcpToolRisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riskLevel]
              properties:
                riskLevel:
                  type: string
                  enum: [read-only, external-write, destructive]
      responses:
        "200":
          description: User-level MCP Tool risk classification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServer"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/mcp-servers/{serverId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/McpServerId"
    put:
      operationId: bindAgentMcpServer
      responses:
        "200":
          description: MCP Server enabled for this Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServer"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: unbindAgentMcpServer
      responses:
        "204":
          description: MCP Server disabled for this Agent without removing it from the user library
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/mcp-tools/{toolId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - name: toolId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: bindAgentMcpTool
      responses:
        "200":
          description: Read-only MCP Tool enabled for this Agent; its Server binding is created when needed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTool"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: unbindAgentMcpTool
      responses:
        "204":
          description: MCP Tool disabled for this Agent
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/agents/{agentId}/mentions:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - name: query
        in: query
        schema:
          type: string
          maxLength: 200
      - name: kinds
        in: query
        description: Comma-separated capability kinds. Defaults to mcp-tool, skill, and discovery.
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    get:
      operationId: listAgentMentions
      responses:
        "200":
          description: Extensible composer mention catalog projected from the user's library and current Agent bindings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentionCatalogPage"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/conversations:
    get:
      operationId: listConversations
      responses:
        "200":
          description: Conversations ordered by latest activity
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversation
      responses:
        "200":
          description: Conversation and ordered messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 32768
      responses:
        "202":
          description: Message persisted and run queued
          content:
            application/json:
              schema:
                type: object
                required: [message, run]
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
                  run:
                    $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: streamRunEvents
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Server-sent stream of RunEvent objects
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: cancelRun
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aegislink_session
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
    SkillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string
    McpServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
    RegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    User:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
        displayName:
          type: string
    AccountSummary:
      type: object
      required: [email, status]
      properties:
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, disabled]
    UserPreferences:
      type: object
      required: [language, theme]
      properties:
        language:
          type: string
          enum: [system, en, zh-CN]
        theme:
          type: string
          enum: [system, light, dark]
    AccountSettingsResponse:
      type: object
      required: [account, user, preferences]
      properties:
        account:
          $ref: "#/components/schemas/AccountSummary"
        user:
          $ref: "#/components/schemas/User"
        preferences:
          $ref: "#/components/schemas/UserPreferences"
    UpdateAccountSettingsRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        language:
          type: string
          enum: [system, en, zh-CN]
        theme:
          type: string
          enum: [system, light, dark]
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    AuthResponse:
      type: object
      required: [user, agent]
      properties:
        user:
          $ref: "#/components/schemas/User"
        agent:
          $ref: "#/components/schemas/Agent"
    Agent:
      type: object
      required: [id, name, description, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DisclosurePolicy:
      type: object
      required: [visibility, channels, indexable, audiences]
      properties:
        visibility:
          type: string
          enum: [private, authenticated, restricted, public]
        channels:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [runtime-context, agent-facts, agent-card]
        indexable:
          type: boolean
        audiences:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 120
    AgentProfileIdentity:
      type: object
      required: [id, name, description, avatarUrl, humanLinked, disclosure]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        avatarUrl:
          type: string
        humanLinked:
          type: boolean
        disclosure:
          $ref: "#/components/schemas/DisclosurePolicy"
    AgentInstructions:
      type: object
      required: [agentId, systemPrompt, version, updatedAt]
      properties:
        agentId:
          type: string
        systemPrompt:
          type: string
          maxLength: 32768
        version:
          type: integer
          format: int64
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    UpdateAgentInstructionsRequest:
      type: object
      required: [expectedVersion, systemPrompt]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        systemPrompt:
          type: string
          maxLength: 32768
    AgentProfileCapability:
      type: object
      required: [id, name, description, kind, tags, source, confidence, callable, disclosure]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [skill, tool, model_capability]
        tags:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [declared, runtime, tool, inferred]
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        callable:
          type: boolean
        disclosure:
          $ref: "#/components/schemas/DisclosurePolicy"
    AgentProfileEndpoint:
      type: object
      required: [id, name, description, disclosure]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        disclosure:
          $ref: "#/components/schemas/DisclosurePolicy"
    EvidenceReference:
      type: object
      required: [kind, id, observedAt]
      properties:
        kind:
          type: string
          enum: [message, run, tool-result, memory, impression, legacy]
        id:
          type: string
        digest:
          type: string
        observedAt:
          type: string
          format: date-time
    Impression:
      type: object
      required:
        [id, scope, kind, summary, details, tags, evidence, confidence, salience, freshness, firstObservedAt, lastObservedAt, decayHalfLifeSeconds, status, generation, createdAt, updatedAt]
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [user, task, project, environment, relationship]
        kind:
          type: string
          enum: [current-task, recent-interest, knowledge-exposure, acquired-information, open-loop, temporary-preference, working-style-observation, recent-decision]
        summary:
          type: string
        details:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceReference"
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        salience:
          type: number
          format: double
          minimum: 0
          maximum: 1
        freshness:
          type: number
          format: double
          minimum: 0
          maximum: 1
        firstObservedAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        decayHalfLifeSeconds:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum: [active, resolved, stale, superseded, dismissed]
        supersededById:
          type: string
        generation:
          $ref: "#/components/schemas/GenerationInfo"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GenerationInfo:
      type: object
      required: [model, runId, promptVersion, generatedAt]
      properties:
        model:
          type: string
        runId:
          type: string
        promptVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
    UpdateImpressionRequest:
      type: object
      required: [expectedContextRevision]
      minProperties: 2
      properties:
        expectedContextRevision:
          type: integer
          format: int64
          minimum: 1
        summary:
          type: string
          minLength: 1
          maxLength: 4000
        details:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [active, dismissed]
    FactCandidate:
      type: object
      required: [id, subject, namespace, key, value, sourceImpressionIds, rationale, confidence, version, status, proposedAt]
      properties:
        id:
          type: string
        subject:
          type: string
          enum: [agent, user, project, task]
        namespace:
          type: string
        key:
          type: string
        value:
          type: object
          additionalProperties: true
        sourceImpressionIds:
          type: array
          minItems: 1
          items:
            type: string
        rationale:
          type: string
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        version:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum: [pending, promoted, rejected]
        proposedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
    ConfirmedFact:
      type: object
      required: [id, subject, namespace, key, value, confidence, confirmation, disclosure, createdAt, updatedAt]
      properties:
        id:
          type: string
        subject:
          type: string
          enum: [agent, user, project, task]
        namespace:
          type: string
        key:
          type: string
        value:
          type: object
          additionalProperties: true
        candidateId:
          type: string
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        confirmation:
          $ref: "#/components/schemas/FactConfirmation"
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        disclosure:
          $ref: "#/components/schemas/DisclosurePolicy"
        revokedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FactConfirmation:
      type: object
      required: [confirmedAt, method]
      properties:
        confirmedAt:
          type: string
          format: date-time
        method:
          type: string
          enum: [owner-confirmed, deterministic-verification]
    ConfirmFactCandidateRequest:
      type: object
      required: [expectedVersion, expectedCandidateVersion]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        expectedCandidateVersion:
          type: integer
          format: int64
          minimum: 1
        subject:
          type: string
          enum: [agent, user, project, task]
        namespace:
          type: string
        key:
          type: string
        value:
          type: object
          additionalProperties: true
    RejectFactCandidateRequest:
      type: object
      required: [expectedCandidateVersion]
      properties:
        expectedCandidateVersion:
          type: integer
          format: int64
          minimum: 1
    AgentProfile:
      type: object
      required: [agentId, version, contextRevision, identity, capabilities, endpoints, confirmedFacts, impressions, pendingFactCount, createdAt, updatedAt]
      properties:
        agentId:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        contextRevision:
          type: integer
          format: int64
          minimum: 1
        identity:
          $ref: "#/components/schemas/AgentProfileIdentity"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AgentProfileCapability"
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/AgentProfileEndpoint"
        confirmedFacts:
          type: array
          items:
            $ref: "#/components/schemas/ConfirmedFact"
        impressions:
          type: array
          items:
            $ref: "#/components/schemas/Impression"
        pendingFactCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateAgentProfileRequest:
      type: object
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 1000
        avatarUrl:
          type: string
          maxLength: 2048
    DisclosurePolicyChange:
      type: object
      required: [subjectType, subjectId, policy]
      properties:
        subjectType:
          type: string
          enum: [identity, capability, confirmed-fact, endpoint]
        subjectId:
          type: string
          minLength: 1
          maxLength: 512
        policy:
          $ref: "#/components/schemas/DisclosurePolicy"
    UpdateDisclosurePoliciesRequest:
      type: object
      required: [expectedVersion, changes]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        changes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/DisclosurePolicyChange"
    SigningKeySummary:
      type: object
      required: [available, status]
      properties:
        available:
          type: boolean
        keyId:
          type: string
        fingerprint:
          type: string
        status:
          type: string
          enum: [unavailable, not-generated, active, retired, revoked]
    AgentPublication:
      type: object
      required: [agentId, revision, enabled, hostname, hostnameStatus, dnsChallenge, ttlSeconds, signingKey, agentFactsReady, agentCard, tokens]
      properties:
        agentId:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 1
        enabled:
          type: boolean
        hostname:
          type: string
        hostnameStatus:
          type: string
          enum: [unconfigured, pending, verified]
        dnsChallenge:
          type: string
        ttlSeconds:
          type: integer
          format: int64
          minimum: 3600
          maximum: 2592000
        signingKey:
          $ref: "#/components/schemas/SigningKeySummary"
        agentFactsReady:
          type: boolean
        lastPublishedAt:
          type: string
          format: date-time
        agentFacts:
          $ref: "#/components/schemas/AgentFactsDocument"
        agentCard:
          $ref: "#/components/schemas/AgentCardPreview"
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/AgentAccessToken"
    UpdateAgentPublicationRequest:
      type: object
      required: [expectedRevision]
      minProperties: 2
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
        hostname:
          type: string
          maxLength: 253
        enabled:
          type: boolean
        ttlSeconds:
          type: integer
          format: int64
          minimum: 3600
          maximum: 2592000
    AgentAccessToken:
      type: object
      required: [id, label, audience, scopes, createdAt, expiresAt, revoked]
      properties:
        id:
          type: string
        label:
          type: string
        audience:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [agent-facts:query]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revoked:
          type: boolean
    CreateAgentAccessTokenRequest:
      type: object
      required: [label, audience]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        audience:
          type: string
          minLength: 1
          maxLength: 120
        expiresAt:
          type: string
          format: date-time
    CreatedAgentAccessToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/AgentAccessToken"
        secret:
          type: string
    AgentCardPreview:
      type: object
      required: [draft, readiness]
      properties:
        draft:
          type: object
          additionalProperties: true
        readiness:
          type: object
          required: [publishable, blockers]
          properties:
            publishable:
              type: boolean
            blockers:
              type: array
              items:
                type: string
    AgentFactsClaim:
      type: object
      required: [id, kind, subject, value, issuer, validFrom, proofRefs]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [identity, capability, confirmed-fact, endpoint]
        subject:
          type: string
        namespace:
          type: string
        key:
          type: string
        value:
          type: object
          additionalProperties: true
        issuer:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        proofRefs:
          type: array
          items:
            type: string
    AgentFactsDocument:
      type: object
      required: [schemaVersion, publicationId, profileVersion, subject, services, claims, privacy, validFrom, validUntil, revocation, proof]
      properties:
        schemaVersion:
          type: string
          enum: [aegislink.agent-facts/1.0-draft]
        publicationId:
          type: string
        profileVersion:
          type: integer
          format: int64
        subject:
          type: object
          additionalProperties: true
        services:
          type: array
          items:
            type: object
            additionalProperties: true
        claims:
          type: array
          items:
            $ref: "#/components/schemas/AgentFactsClaim"
        privacy:
          type: object
          additionalProperties: true
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        revocation:
          type: object
          additionalProperties: true
        proof:
          type: object
          additionalProperties: true
    AgentFactsQueryRequest:
      type: object
      required: [selectors]
      properties:
        nonce:
          type: string
          maxLength: 256
        selectors:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            properties:
              claimId:
                type: string
              namespace:
                type: string
              key:
                type: string
    Memory:
      type: object
      required:
        [
          id,
          bound,
          agentId,
          kind,
          content,
          confidence,
          sourceUri,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        agentId:
          type: string
        kind:
          type: string
          enum: [semantic, episodic]
        content:
          type: string
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        sourceUri:
          type: string
        status:
          type: string
          enum: [active, forgotten]
        lastConfirmedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateMemoryRequest:
      type: object
      required: [kind, content, sourceUri]
      properties:
        kind:
          type: string
          enum: [semantic, episodic]
        content:
          type: string
          minLength: 1
          maxLength: 4000
        sourceUri:
          type: string
          maxLength: 1000
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 1
    UpdateMemoryRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [semantic, episodic]
        content:
          type: string
          minLength: 1
          maxLength: 4000
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        confirmed:
          type: boolean
    SkillFile:
      type: object
      required: [path, mediaType, sizeBytes, contentHash, textReadable]
      properties:
        path:
          type: string
          description: Normalized path relative to the Skill bundle root
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        contentHash:
          type: string
        textReadable:
          type: boolean
          description: Whether the Agent Runtime may load this file as UTF-8 text
    Skill:
      type: object
      required:
        [
          id,
          versionId,
          agentId,
          name,
          description,
          version,
          sourceType,
          content,
          contentHash,
          files,
          enabled,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          description: Stable Skill package identifier used by Agent binding routes
        versionId:
          type: string
          description: Immutable selected Skill version identifier for this Agent
        agentId:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        sourceType:
          type: string
          enum: [inline, local, git]
        content:
          type: string
        contentHash:
          type: string
        files:
          type: array
          description: Immutable files stored for the selected Skill version
          items:
            $ref: "#/components/schemas/SkillFile"
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InstallSkillRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 131072
        version:
          type: string
          maxLength: 80
          description: Optional immutable version label; omitted inline installs use a content-derived local label
    McpTool:
      type: object
      required:
        [id, serverId, name, description, inputSchema, enabled, riskLevel]
      properties:
        id:
          type: string
        serverId:
          type: string
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
        riskLevel:
          type: string
          enum: [read-only, external-write, destructive]
    McpServer:
      type: object
      required:
        [
          id,
          name,
          endpoint,
          transport,
          enabled,
          status,
          tools,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        bound:
          type: boolean
          description: Whether this user-owned Server is enabled for the requested Agent projection
        name:
          type: string
        endpoint:
          type: string
          format: uri
        transport:
          type: string
          enum: [streamable-http]
        enabled:
          type: boolean
        status:
          type: string
          enum: [unchecked, connected, error]
        protocolVersion:
          type: string
        lastError:
          type: string
        lastCheckedAt:
          type: string
          format: date-time
        tools:
          type: array
          items:
            $ref: "#/components/schemas/McpTool"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateMcpServerRequest:
      type: object
      required: [agentId, name, endpoint]
      properties:
        agentId:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 80
        endpoint:
          type: string
          format: uri
          maxLength: 2048
    UpdateMcpServerRequest:
      type: object
      required: [name, endpoint]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        endpoint:
          type: string
          format: uri
          maxLength: 2048
    MentionGroup:
      type: object
      required: [id, kind, label]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [mcp-plugin, agent, system]
        label:
          type: string
    MentionItem:
      type: object
      required:
        [
          id,
          kind,
          category,
          group,
          label,
          description,
          action,
          availability,
          resourceId,
        ]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [mcp-tool, skill, discovery]
        category:
          type: string
          enum: [mcp, skills, discovery]
        group:
          $ref: "#/components/schemas/MentionGroup"
        label:
          type: string
        description:
          type: string
        action:
          type: string
          enum: [force-tool-once, use-skill-once, discover-once]
        availability:
          type: string
          enum:
            [
              ready,
              needs-agent-enable,
              server-offline,
              tool-disabled,
              skill-disabled,
              approval-required,
            ]
        disabledReason:
          type: string
        resourceId:
          type: string
    MentionCatalogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MentionItem"
        nextCursor:
          type: string
    RunExecutionPolicy:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [auto, force-tool-once, use-skill-once, discover-once]
        kind:
          type: string
          enum: [mcp-tool, skill, discovery]
        action:
          type: string
          enum: [force-tool-once, use-skill-once, discover-once]
        mentionId:
          type: string
        resourceId:
          type: string
        label:
          type: string
        toolId:
          type: string
        toolName:
          type: string
        skillId:
          type: string
        skillName:
          type: string
    Conversation:
      type: object
      required: [id, agentId, title, createdAt, updatedAt]
      properties:
        id:
          type: string
        agentId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, conversationId, role, content, sequence, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        runId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        sequence:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    Run:
      type: object
      required: [id, conversationId, status, executionPolicy, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        failureCode:
          type: string
        executionPolicy:
          $ref: "#/components/schemas/RunExecutionPolicy"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    RunEvent:
      type: object
      required: [runId, sequence, type, payload, occurredAt]
      properties:
        runId:
          type: string
        sequence:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - run.started
            - tool.started
            - tool.completed
            - tool.failed
            - message.delta
            - message.completed
            - run.failed
            - run.cancelled
        payload:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    AgUiRunAgentInput:
      type: object
      required:
        [threadId, runId, state, messages, tools, context, forwardedProps]
      properties:
        threadId:
          type: string
          description: Existing AegisLink conversation identifier
        runId:
          type: string
          description: Client-generated identifier for this AG-UI run
        parentRunId:
          type: string
        state:
          description: Agent-owned state supplied by the AG-UI client
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AgUiMessage"
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        context:
          type: array
          items:
            type: object
            additionalProperties: true
        forwardedProps:
          $ref: "#/components/schemas/AgUiForwardedProps"
    AgUiForwardedProps:
      type: object
      additionalProperties: true
      properties:
        aegislink:
          type: object
          properties:
            selection:
              type: object
              required: [mentionId, action]
              properties:
                mentionId:
                  type: string
                action:
                  type: string
                  enum: [force-tool-once, use-skill-once, discover-once]
    AgUiMessage:
      type: object
      required: [id, role]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [developer, system, assistant, user, tool, reasoning]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
      additionalProperties: true
    ConversationDetail:
      type: object
      required: [conversation, messages]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        activeRun:
          $ref: "#/components/schemas/Run"
    BootstrapResponse:
      type: object
      required: [user, agent, model]
      properties:
        user:
          $ref: "#/components/schemas/User"
        agent:
          $ref: "#/components/schemas/Agent"
        model:
          $ref: "#/components/schemas/ModelInfo"
    ModelInfo:
      type: object
      required: [id, driver, name, capabilities]
      properties:
        id:
          type: string
          description: Stable identifier for the configured model profile
        driver:
          type: string
          description: Runtime provider used to create the model
        name:
          type: string
          description: Provider-specific model name
        capabilities:
          type: array
          items:
            type: string
            enum: [streaming, tool-calling]
