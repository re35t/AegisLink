<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AegisLink Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>AegisLink Console</h1>
        <button id="refresh" type="button">Refresh</button>
      </header>

      <section>
        <h2>Register Agent</h2>
        <form id="agent-form">
          <label>Agent ID <input name="id" placeholder="local-agent" /></label>
          <label>Owner User ID <input name="ownerUserId" value="user-1" required /></label>
          <label>Display Name <input name="displayName" value="Local Agent" required /></label>
          <label>Public Key PEM <textarea name="publicKeyPem" required></textarea></label>
          <button type="submit">Register</button>
        </form>
      </section>

      <section>
        <h2>Issue Capability</h2>
        <form id="capability-form">
          <label>Subject Agent ID <input name="subjectAgentId" value="local-agent" required /></label>
          <label>Audience Agent ID <input name="audienceAgentId" value="remote-agent" /></label>
          <label>Actions <input name="actions" value="agent.message.ask" required /></label>
          <label>Resources <input name="resources" value="agent:remote-agent" required /></label>
          <label>Scope
            <select name="scope">
              <option>self</option>
              <option selected>team</option>
              <option>org</option>
              <option>public</option>
            </select>
          </label>
          <label>Expires At <input name="expiresAt" type="datetime-local" required /></label>
          <button type="submit">Issue</button>
        </form>
      </section>

      <section>
        <h2>State</h2>
        <div class="grid">
          <article>
            <h3>Agents</h3>
            <pre id="agents"></pre>
          </article>
          <article>
            <h3>Capabilities</h3>
            <pre id="capabilities"></pre>
          </article>
          <article>
            <h3>Messages</h3>
            <pre id="messages"></pre>
          </article>
          <article>
            <h3>Audit</h3>
            <pre id="audit"></pre>
          </article>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
