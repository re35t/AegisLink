name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: aegislink_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegislink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aegislink_test?sslmode=disable
      INDEX_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aegislink_index_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create standalone Index test database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres aegislink_index_test
      - name: Check generated API types
        run: |
          pnpm generate:api
          git diff --exit-code -- web/src/api/schema.ts
      - name: Check Go
        run: |
          test -z "$(gofmt -l cmd index internal migrations)"
          go vet ./...
          go build ./cmd/aegislink-server
          go build ./index/cmd/aegislink-index
      - name: Test Go with PostgreSQL and mock model service
        run: go test ./...
      - name: Check and test Web
        run: |
          pnpm check:web
          pnpm test:web
          pnpm build:web
