services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aegislink
      POSTGRES_USER: aegislink
      POSTGRES_PASSWORD: aegislink
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegislink -d aegislink"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - aegislink-postgres:/var/lib/postgresql/data

volumes:
  aegislink-postgres:
